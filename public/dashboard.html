<!DOCTYPE html>
<html>
<head>
    <title>News2NetWorth Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            height: 100vh;
            background: linear-gradient(135deg, #0f172a, #1e293b, #0f172a);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: white;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 60px;
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
        }

        .logout-btn {
            background: #ef4444;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }

        .logout-btn:hover {
            background: #dc2626;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 85vh;
        }

        .card {
            background: rgba(255, 255, 255, 0.08);
            padding: 40px;
            width: 60%;
            border-radius: 20px;
            backdrop-filter: blur(15px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            text-align: center;
        }

        .card h2 {
            margin-bottom: 25px;
            font-size: 26px;
        }

        textarea {
            width: 100%;
            height: 160px;
            padding: 15px;
            border-radius: 12px;
            border: none;
            outline: none;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .analyze-btn {
            background: linear-gradient(90deg, #38bdf8, #0ea5e9);
            padding: 12px 30px;
            border-radius: 30px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .analyze-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px #38bdf8;
        }

        .result {
            margin-top: 25px;
            font-size: 18px;
            padding: 15px;
            border-radius: 10px;
            background: rgba(255,255,255,0.1);
            display: none;
        }

        @media(max-width: 768px) {
            .card {
                width: 90%;
            }
        }
    </style>
</head>

<body>

<nav>
    <div class="logo">📊 News2NetWorth</div>
    <button class="logout-btn" onclick="logout()">Logout</button>
</nav>

<div class="container">
    <div class="card">
        <h2>Analyze Financial News Impact</h2>

        <textarea id="newsText" placeholder="Paste business news here..."></textarea>

        <button class="analyze-btn" onclick="analyzeNews()">Analyze</button>

        <div class="result" id="result"></div>
    </div>
</div>

<script>
function logout() {
    localStorage.removeItem("token");
    window.location.href = "/login.html";
}

async function analyzeNews() {
    const text = document.getElementById("newsText").value;

    if (!text) {
        alert("Please enter news text");
        return;
    }

    const response = await fetch("/api/analyze", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + localStorage.getItem("token")
        },
        body: JSON.stringify({ text })
    });

    const data = await response.json();

    const resultDiv = document.getElementById("result");
    resultDiv.style.display = "block";
    resultDiv.innerText = data.message;
}
</script>

</body>
</html>
